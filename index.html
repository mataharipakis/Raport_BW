                { id: 's2', nis: '1002', nama_santri: 'Zaid bin Tsabit', id_tahun: 'ta1', kelas_diniyah: '1 A', kelas_quran: 'Al-Quran', kelas_b_arab: 'Mutawassith', 
                  absen_jamaah: 0, absen_quran: 0, absen_b_arab: 0, absen_diniyah: 0, catatan_pengasuh: 'Sangat baik, pertahankan prestasimu.' }
            ],

                { id: 'n1', id_santri: 's1', id_mapel: 'm1', harian_1: 80, harian_2: 85, harian_3: 85, ujian_tulis: 90, ujian_hafalan: 88, status_quran: 'Lulus', status_b_arab: 'Naik', status_diniyah: 'Naik', catatan_guru: 'Rajin bertanya' },
                { id: 'n2', id_santri: 's1', id_mapel: 'm2', harian_1: 75, harian_2: 78, harian_3: 75, ujian_tulis: 80, ujian_hafalan: null, status_quran: 'Lulus', status_b_arab: 'Naik', status_diniyah: 'Naik', catatan_guru: 'Pahami bab bersuci' }
            ]
        };

        const $ = (id) => document.getElementById(id);
        
        window.showToast = (message, type = 'success') => {
            const container = $('toast-container');
            const toast = document.createElement('div');
            const colors = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-blue-500' };
            const icons = { success: 'ph-check-circle', error: 'ph-warning-circle', info: 'ph-info' };
            
            toast.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-enter pointer-events-auto`;
            toast.innerHTML = `<i class="ph-fill ${icons[type]} text-xl"></i> <span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.generateId = () => Math.random().toString(36).substr(2, 9);

        window.fileToBase64 = (file, maxWidth = 800) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scaleSize = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
                reader.onerror = error => reject(error);
            });
        };

        const API = {
            async getList(collectionName) {
                if (IS_PREVIEW) return [...memoryDb[collectionName]];
                const snapshot = await getDocs(collection(db, collectionName));
                return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            },
            async getOne(collectionName, id) {
                if (IS_PREVIEW) {
                    if (collectionName === 'pengaturan') return memoryDb.pengaturan;
                    return memoryDb[collectionName].find(x => x.id === id) || null;
                }
                const docRef = doc(db, collectionName, id);
                const docSnap = await getDoc(docRef);
                return docSnap.exists() ? { id: docSnap.id, ...docSnap.data() } : null;
            },
            async save(collectionName, data, id = null) {
                if (IS_PREVIEW) {
                    if (id && collectionName === 'pengaturan') {
                        memoryDb.pengaturan = { ...memoryDb.pengaturan, ...data };
                        return;
                    }
                    if (id) {
                        const index = memoryDb[collectionName].findIndex(x => x.id === id);
                        if (index > -1) memoryDb[collectionName][index] = { id, ...data };
                        else memoryDb[collectionName].push({ id, ...data });
                    } else {
                        memoryDb[collectionName].push({ id: generateId(), ...data });
                    }
                    return;
                }
                if (id) await setDoc(doc(db, collectionName, id), data, { merge: true });
                else await addDoc(collection(db, collectionName), data);
            },
            async delete(collectionName, id) {
                if (IS_PREVIEW) {
                    memoryDb[collectionName] = memoryDb[collectionName].filter(x => x.id !== id);
                    return;
                }
                await deleteDoc(doc(db, collectionName, id));
            },
            async query(collectionName, field, operator, value) {
                if (IS_PREVIEW) {
                    return memoryDb[collectionName].filter(x => {
                        if (operator === '==') return x[field] === value;
                        return false;
                    });
                }
                const q = query(collection(db, collectionName), where(field, operator, value));
                const snapshot = await getDocs(q);
                return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            }
        };

        window.switchLoginTab = (role) => {
            loginTab = role;
            $('tab-admin').className = role === 'admin' ? 'flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow text-primary transition' : 'flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 transition';
            $('tab-guru').className = role === 'guru' ? 'flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow text-primary transition' : 'flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 transition';
            
            $('lbl-username').innerText = role === 'admin' ? 'Email Admin' : 'Username Guru';
            $('login-username').placeholder = role === 'admin' ? 'admin@madrasah.com' : 'username_guru';
            $('login-username').type = role === 'admin' ? 'email' : 'text';
            $('login-username').value = '';
            $('login-password').value = '';
        };

        window.handleLogin = async () => {
            const userVal = $('login-username').value;
            const passVal = $('login-password').value;
            
            try {
                if (loginTab === 'admin') {
                    if (IS_PREVIEW) {
                        if (userVal === 'admin@demo.com' && passVal === '123456') {
                            finalizeLogin({ role: 'admin', email: userVal, name: 'Administrator' });
                        } else throw new Error("Kredensial Admin Demo Salah!");
                    } else {
                        const cred = await signInWithEmailAndPassword(auth, userVal, passVal);
                        finalizeLogin({ role: 'admin', email: cred.user.email, name: 'Administrator' });
                    }
                } else {
                    const gurus = await API.query('guru', 'username', '==', userVal);
                    if (gurus.length > 0 && gurus[0].password === passVal) {
                        finalizeLogin({ role: 'guru', ...gurus[0] });
                    } else {
                        throw new Error("Username atau Password Guru salah!");
                    }
                }
            } catch (err) {
                showToast(err.message || "Gagal Login", "error");
            }
        };

        const finalizeLogin = (user) => {
            currentUser = user;
            currentRole = user.role;
            $('login-view').classList.add('hidden');
            $('app-view').classList.remove('hidden');
            $('sidebar-role').innerText = currentRole === 'admin' ? 'Administrator' : `Guru: ${user.nama_guru}`;
            showToast(`Selamat datang, ${user.name || user.nama_guru}`);
            renderNavigation();
            navigate('dashboard');
        };

        window.handleLogout = () => {
            if (!IS_PREVIEW && currentRole === 'admin') signOut(auth);
            currentUser = null;
            $('login-view').classList.remove('hidden');
            $('app-view').classList.add('hidden');
            $('login-username').value = '';
            $('login-password').value = '';
        };

        window.addEventListener('DOMContentLoaded', () => {
            if (IS_PREVIEW) {
                $('preview-badge').classList.remove('hidden');
                $('demo-credentials').classList.remove('hidden');
            }
        });

        const MENUS = {

                { id: 'mapel', icon: 'ph-books', label: 'Data Mapel' },

                { id: 'nilai', icon: 'ph-exam', label: 'Input Nilai & Excel' },

            ],

                { id: 'dashboard', icon: 'ph-squares-four', label: 'Dashboard' },
                { id: 'nilai_guru', icon: 'ph-exam', label: 'Input Nilai Mapel' },
            ]
        };

        const renderNavigation = () => {
            const menus = currentRole === 'admin' ? MENUS.admin : MENUS.guru;

        window._santriFilterTA = '';

                if(!draft[sId]) draft[sId] = {

                    harian_1: null, harian_2: null, harian_3: null, ujian_tulis: null, ujian_hafalan: null,

                    draft[sId][field] = inp.value;
                } else {
                    draft[sId][field] = inp.value === '' ? null : parseFloat(inp.value);
                }
            });

            const existing = await API.query('nilai', 'id_mapel', '==', mapelId);

                const ex = existing.find(x => x.id_santri === sId);

                } else {

                                    <th class="p-1 w-16 text-center">Tulis</th>
                                    <th class="p-1 w-16 text-center">Hafalan</th>
                                    <th class="p-1 w-16 text-center">Rata²</th>
                                </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                    </div>

                    <div class="mt-4 flex justify-end">
                        <button onclick="saveGuruManualNilai('${mapelId}')" class="bg-primary hover:bg-secondary text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow transition flex items-center gap-2">
                            <i class="ph-bold ph-floppy-disk"></i> Simpan / Konfirmasi Nilai
                        </button>
                    </div>
                </div>
            `;
        }

        window.saveGuruManualNilai = async (mapelId) => {
            const inputs = document.querySelectorAll('.guru-n-input');
            let draft = {};
            inputs.forEach(inp => {
                const sId = inp.getAttribute('data-id');
                const field = inp.getAttribute('data-f');
                if(!draft[sId]) draft[sId] = { 
                    id_santri: sId, id_mapel: mapelId, 
                    harian_1: null, harian_2: null, harian_3: null, ujian_tulis: null, ujian_hafalan: null, 
                    status_quran: 'Lulus', status_b_arab: 'Naik', status_diniyah: 'Naik', catatan_guru: '' 
                };
                if(field === 'catatan_guru' || field.startsWith('status_')) {
                    draft[sId][field] = inp.value;
                } else {
                    draft[sId][field] = inp.value === '' ? null : parseFloat(inp.value);
                }
            });

            const existing = await API.query('nilai', 'id_mapel', '==', mapelId);
            for (const sId in draft) {
                const ex = existing.find(x => x.id_santri === sId);
                if (ex) {
                    await API.save('nilai', draft[sId], ex.id);
                } else {
                    const d = draft[sId];
                    if(d.harian_1 !== null || d.harian_2 !== null || d.harian_3 !== null || d.ujian_tulis !== null || d.ujian_hafalan !== null || d.catatan_guru !== '') {
                        await API.save('nilai', d);
                    }
                }
            }
            showToast("Nilai berhasil disimpan!");
            renderContent();
        };

        async function viewCetak(container) {
            const santris = await API.getList('santri');
            const tas = await API.getList('tahun_akademik');
            const klasses = await API.getList('kelas');

            const selTA = window._cetakFilterTA || '';
            const selKD = window._cetakFilterKD || '';
            const selSantriId = window._cetakFilterSantri || '';

            const filteredSantris = santris.filter(s => {
                let matchTA = selTA ? s.id_tahun === selTA : true;
                let matchKD = selKD ? String(s.kelas_diniyah).trim() === String(selKD).trim() : true;
                let matchSantri = selSantriId ? s.id === selSantriId : true;
                return matchTA && matchKD && matchSantri;
            });

            let taOpts = `<option value="">-- Semua Tahun Akademik --</option>` + tas.map(t => `<option value="${t.id}" ${selTA===t.id?'selected':''}>${t.nama_tahun} (${t.semester})</option>`).join('');
            let kdOpts = `<option value="">-- Semua Kelas Diniyah --</option>` + klasses.filter(k=>k.tingkat==='Diniyah').map(k => `<option value="${k.nama_kelas}" ${selKD===k.nama_kelas?'selected':''}>${k.nama_kelas}</option>`).join('');
            let santriOpts = `<option value="">-- Semua / Cari Siswa --</option>` + santris.map(s => `<option value="${s.id}" ${selSantriId===s.id?'selected':''}>${s.nama_santri} (NIS: ${s.nis || '-'})</option>`).join('');

            let santriListHtml = '';
            if (filteredSantris.length > 0) {
                santriListHtml = filteredSantris.map((s, idx) => `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b">
                            <div>
                                <h3 class="font-bold text-slate-800 text-lg">${idx + 1}. ${s.nama_santri} <span class="text-xs font-mono bg-slate-100 text-slate-600 px-2 py-0.5 rounded ml-2">NIS: ${s.nis || '-'}</span></h3>
                                <p class="text-xs text-slate-500">Kelas Diniyah: ${s.kelas_diniyah || '-'} | Qur'an: ${s.kelas_quran || '-'} | B. Arab: ${s.kelas_b_arab || '-'}</p>
                            </div>
                            <button onclick="prosesCetakSatuSantri('${s.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow">
                                <i class="ph-bold ph-printer"></i> Cetak Raport Ini
                            </button>
                        </div>
                        <div class="border rounded-lg p-4 bg-slate-50 overflow-x-auto preview-card-santri" id="preview-santri-${s.id}"></div>
                    </div>
                `).join('');
            } else {
                santriListHtml = `<div class="bg-white p-8 rounded-xl text-center text-slate-400 border border-slate-200">Tidak ada santri yang sesuai dengan filter yang dipilih.</div>`;
            }

            container.innerHTML = `
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-slate-800">Cetak Raport (Folio/F4)</h1>
                    <p class="text-slate-500 text-sm">Filter berdasarkan Tahun Akademik, Kelas, atau Siswa tertentu untuk langsung menampilkan pratinjau raport.</p>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center">
                    <div class="flex items-center gap-2 text-sm text-slate-600 font-semibold"><i class="ph-bold ph-funnel"></i> Filter Cetak:</div>
                    <div class="flex-1 min-w-[180px]">
                        <select id="cetak_filter_ta" onchange="window._cetakFilterTA=this.value; renderContent();" class="w-full p-2 border rounded text-sm">${taOpts}</select>
                    </div>
                    <div class="flex-1 min-w-[180px]">
                        <select id="cetak_filter_kd" onchange="window._cetakFilterKD=this.value; renderContent();" class="w-full p-2 border rounded text-sm">${kdOpts}</select>
                    </div>
                    <div class="flex-1 min-w-[200px]">
                        <select id="cetak_filter_santri" onchange="window._cetakFilterSantri=this.value; renderContent();" class="w-full p-2 border rounded text-sm">${santriOpts}</select>
                    </div>
                    ${(selTA || selKD || selSantriId) ? `<button onclick="window._cetakFilterTA=''; window._cetakFilterKD=''; window._cetakFilterSantri=''; renderContent();" class="text-xs text-red-500 hover:underline">Reset</button>` : ''}
                    ${filteredSantris.length > 0 ? `
                        <button onclick="prosesCetakKelasAktif()" class="bg-primary hover:bg-secondary text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow ml-auto">
                            <i class="ph-bold ph-printer"></i> Cetak Semua (${filteredSantris.length} Santri)
                        </button>
                    ` : ''}
                </div>

                <div id="wrapper-preview-list">
                    ${santriListHtml}
                </div>
            `;

            if (filteredSantris.length > 0) {
                setTimeout(async () => {
                    for(let s of filteredSantris) {
                        const htmlContent = await generateRaportHTML(s.id);
                        const el = document.getElementById(`preview-santri-${s.id}`);
                        if(el) el.innerHTML = htmlContent;
                    }
                }, 50);
            }
        };

        window.prosesCetakSatuSantri = async (sId) => {
            const htmlContent = await generateRaportHTML(sId);
            const pa = $('print-area');
            pa.innerHTML = `<div style="page-break-after: always;">${htmlContent}</div>`;
            setTimeout(() => { window.print(); }, 300);
        };

        window.prosesCetakKelasAktif = async () => {
            const santris = await API.getList('santri');
            const selTA = window._cetakFilterTA || '';
            const selKD = window._cetakFilterKD || '';

            const filteredSantris = santris.filter(s => {
                let matchTA = selTA ? s.id_tahun === selTA : true;
                let matchKD = selKD ? String(s.kelas_diniyah).trim() === String(selKD).trim() : true;
                return matchTA && matchKD;
            });

            if(filteredSantris.length === 0) return showToast("Tidak ada data untuk dicetak", "error");

            showToast("Menyiapkan dokumen cetak massal...", "info");
            let combinedHTML = '';
            for(let s of filteredSantris) {
                const htmlContent = await generateRaportHTML(s.id);
                combinedHTML += `<div style="page-break-after: always; margin-bottom: 20mm;">${htmlContent}</div>`;
            }

            const pa = $('print-area');
            pa.innerHTML = combinedHTML;
            setTimeout(() => { window.print(); }, 500);
        };

        const generateRaportHTML = async (sId) => {
            const santri = await API.getOne('santri', sId);
            const mapels = await API.getList('mapel');
            const allNilai = await API.query('nilai', 'id_santri', '==', sId);
            const peng = await API.getOne('pengaturan', 'default') || {};

            const firstNilaiWithStatus = allNilai.find(n => n.status_quran) || {};
            const statusQuran = firstNilaiWithStatus.status_quran || 'Lulus';
            const statusBArab = firstNilaiWithStatus.status_b_arab || 'Naik';
            const statusDiniyah = firstNilaiWithStatus.status_diniyah || 'Naik';

            let trs = '';
            mapels.forEach((m, i) => {
                const n = allNilai.find(x => x.id_mapel === m.id) || {};
                const ut = n.ujian_tulis !== null && n.ujian_tulis !== undefined && n.ujian_tulis !== '' ? parseFloat(n.ujian_tulis) : null;
                const uh = n.ujian_hafalan !== null && n.ujian_hafalan !== undefined && n.ujian_hafalan !== '' ? parseFloat(n.ujian_hafalan) : null;
                
                let avgUjian = '';
                if(ut !== null && uh !== null) {
                    avgUjian = ((ut + uh) / 2).toFixed(1);
                } else if(ut !== null) {
                    avgUjian = ut;
                } else if(uh !== null) {
                    avgUjian = uh;
                } else if(n.ujian !== null && n.ujian !== undefined && n.ujian !== '') {
                    avgUjian = n.ujian;
                }

                trs += `
                    <tr>
                        <td style="border: 1px solid #000; padding: 4px 6px; text-align: center;">${i+1}</td>
                        <td style="border: 1px solid #000; padding: 4px 6px; text-align: left;">${m.nama_mapel}</td>
                        <td style="border: 1px solid #000; padding: 4px 6px; text-align: center;">${m.kkm}</td>
                        <td style="border: 1px solid #000; padding: 4px 6px; text-align: center;">${n.harian_1 !== null && n.harian_1 !== undefined ? n.harian_1 : ''}</td>
                        <td style="border: 1px solid #000; padding: 4px 6px; text-align: center;">${n.harian_2 !== null && n.harian_2 !== undefined ? n.harian_2 : ''}</td>
                        <td style="border: 1px solid #000; padding: 4px 6px; text-align: center;">${n.harian_3 !== null && n.harian_3 !== undefined ? n.harian_3 : ''}</td>
                        <td style="border: 1px solid #000; padding: 4px 6px; text-align: center; font-weight: bold;">${avgUjian}</td>
                        <td style="border: 1px solid #000; padding: 4px 6px; text-align: left;">${n.catatan_guru || ''}</td>
                    </tr>
                `;
            });

            const formatStatus = (val, opt1, opt2) => {
                if(val === opt1) return `${opt1} / <del>${opt2}</del>`;
                if(val === opt2) return `<del>${opt1}</del> / ${opt2}`;
                return `${opt1} / ${opt2}`;
            };

            return `
                <div class="print-container">
                    <div class="text-center w-full mb-4">
                        ${peng.kop_image ? `<img src="${peng.kop_image}" style="max-width: 100%; height: auto; max-height: 120px; object-fit: contain; margin: 0 auto;" />` : `<h1 style="font-size:16pt; font-weight:bold;">KOP PONDOK BELUM DIATUR</h1>`}
                    </div>
                    
                    <table style="width: 100%; font-size:11pt; margin-bottom: 10px; font-family:'Times New Roman', serif;">
                        <tr><td style="width:130px;">Nama Santri</td><td>: <b>${santri.nama_santri}</b></td></tr>
                        <tr><td>Kelas Diniyah</td><td>: ${santri.kelas_diniyah || '-'}</td></tr>
                        <tr><td>Kelas Qur'an</td><td>: ${santri.kelas_quran || '-'}</td></tr>
                        <tr><td>Kelas B. Arab</td><td>: ${santri.kelas_b_arab || '-'}</td></tr>
                    </table>

                    <table style="border-collapse: collapse; width: 100%; font-size: 11pt; margin-top: 10px; font-family:'Times New Roman', serif;">
                        <thead>
                            <tr style="background-color: #f1f5f9;">
                                <th style="border: 1px solid #000; padding: 6px; width: 30px;" rowspan="2">NO</th>
                                <th style="border: 1px solid #000; padding: 6px;" rowspan="2">Mata Pelajaran</th>
                                <th style="border: 1px solid #000; padding: 6px; width: 40px;" rowspan="2">KKM</th>
                                <th style="border: 1px solid #000; padding: 4px;" colspan="3">Nilai Harian (NH)</th>
                                <th style="border: 1px solid #000; padding: 6px; width: 50px;" rowspan="2">Nilai Ujian<br><span style="font-size:8pt; font-weight:normal;">(Rata²)</span></th>
                                <th style="border: 1px solid #000; padding: 6px;" rowspan="2">Catatan Guru</th>
                            </tr>
                            <tr style="background-color: #f1f5f9;">
                                <th style="border: 1px solid #000; padding: 4px; width: 35px; font-size: 10pt;">1</th>
                                <th style="border: 1px solid #000; padding: 4px; width: 35px; font-size: 10pt;">2</th>
                                <th style="border: 1px solid #000; padding: 4px; width: 35px; font-size: 10pt;">3</th>
                            </tr>
                        </thead>
                        <tbody>${trs}</tbody>
                    </table>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 11pt; margin-top: 15px;">
                        <div style="border: 1px solid #000; padding: 8px; min-height: 80px;">
                            <b>Catatan Pengasuh:</b><br><br>
                            <i>${santri.catatan_pengasuh || ''}</i>
                        </div>
                        <div style="border: 1px solid #000; padding: 8px;">
                            <b>Rekap Absensi:</b>
                            <table style="width:100%; font-size:11pt; margin-top:5px;">
                                <tr><td>Jamaah</td><td>: ${santri.absen_jamaah || 0}</td></tr>
                                <tr><td>Kelas Qur'an</td><td>: ${santri.absen_quran || 0}</td></tr>
                                <tr><td>Kelas B. Arab</td><td>: ${santri.absen_b_arab || 0}</td></tr>
                                <tr><td>Kelas Diniyah</td><td>: ${santri.absen_diniyah || 0}</td></tr>
                            </table>
                        </div>
                    </div>

                    <div style="margin-top: 15px; font-size: 11pt; line-height: 1.6;">
                        Santri dengan Nama <b>${santri.nama_santri}</b> dinyatakan :<br>
                        ${formatStatus(statusQuran, 'Lulus', 'Tidak Lulus')} Ujian Qur'an<br>
                        ${formatStatus(statusBArab, 'Naik', 'Tidak Naik')} Ujian B. Arab<br>
                        ${formatStatus(statusDiniyah, 'Naik', 'Tidak Naik')} Kelas Diniyah
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; margin-top: 30px; text-align: center; font-size: 11pt;">
                        <div>
                            <br>TTD Ortu,<br><br><br><br>
                            ( .................................... )
                        </div>
                        <div>
                            ${peng.tanggal_cetak || '..................., ....................'}
                            <br>TTD Pengasuh,<br>
                            ${peng.ttd_pengasuh ? `<img src="${peng.ttd_pengasuh}" style="max-height: 70px; margin: 5px auto;" />` : `<br><br><br>`}
                            <b>${peng.nama_pengasuh || '..........................'}</b>
                        </div>
                    </div>
                </div>
            `;
        };

        window.openModal = (title, bodyHtml, footerHtml) => {
            $('modal-title').innerText = title;
            $('modal-body').innerHTML = bodyHtml;
            $('modal-footer').innerHTML = footerHtml;
            $('modal-container').classList.remove('hidden');
            setTimeout(() => $('modal-content').classList.remove('scale-95'), 10);
        };

        window.closeModal = () => {
            $('modal-content').classList.add('scale-95');
            setTimeout(() => $('modal-container').classList.add('hidden'), 200);
        };

        window.deleteData = async (collectionName, id) => {
            if(confirm("Yakin ingin menghapus data ini?")) {
                await API.delete(collectionName, id);
                showToast("Data dihapus!");
                renderContent();
            }
        };

        if ('serviceWorker' in navigator && !IS_PREVIEW) {
            const swCode = `
                self.addEventListener('install', (e) => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => new Response('Offline mode not fully supported.')));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
        }
    </script>
</body>
</html>
